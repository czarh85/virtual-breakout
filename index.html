<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Virtual Breakout</title>
<meta name="description" content="A stereoscopic brick-breaker for the Nintendo Virtual Boy. Launch site in preparation.">
<style>
  :root{--fond:#080303;--vif:#ff2d1a;--encre:#ffb0a4;--sourdine:#a9635a;--filet:#4a1111}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fond);
    color:var(--encre);font-family:"Iowan Old Style",Palatino,Georgia,serif;
    padding:2rem;text-align:center;line-height:1.7}
  h1{font-family:Futura,"Avenir Next",system-ui,sans-serif;font-size:clamp(2.2rem,9vw,4.5rem);
    letter-spacing:.07em;color:var(--vif);margin:0 0 .8rem;line-height:.95;
    text-shadow:0 0 28px rgba(255,45,26,.4)}
  p.b{font-family:Futura,"Avenir Next",system-ui,sans-serif;letter-spacing:.26em;
    text-transform:uppercase;font-size:.8rem;color:var(--sourdine);margin:0 0 2.5rem}
  p{max-width:34rem;margin:0 auto 1rem}
  .fin{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--filet);
    color:var(--sourdine);font-size:.85rem}
  a{color:var(--vif)}
</style>
</head>
<body>
<main>
  <h1>VIRTUAL<br>BREAKOUT</h1>
  <p class="b">A stereoscopic brick-breaker for the Nintendo Virtual Boy</p>
  <p>The launch site is being prepared. It will publish the complete illustrated
  manual, a gallery of every sector, a press kit, and the free ROM.</p>
  <p class="fin">Built with <a href="https://www.vuengine.dev/">VUEngine</a>.
  Not affiliated with Nintendo.</p>
</main>
</body>
</html>
